name: Copy repo to test publish location

on:
   push:
    branches:
      - develop

jobs:
   copyfiles:
      runs-on: self-hosted
      
      steps:
      - uses: actions/checkout@v2
      
      - name: Stop application pool
        run: Stop-WebAppPool -Name "${{ secrets.APPLICATION_POOL_TEST }}"
      
      - name: copy files from worker to site
        run: Xcopy ${{ secrets.WORKER_LOCATION_TEST }} ${{ secrets.PUBLISH_LOCATION_TEST }} /E/H/C/I/exclude:${{ secrets.PUBLISH_LOCATION_TEST }}\actionrunnerexclusions.txt/Y

      - name: Start application pool
        if: ${{ always() }}
        run: Start-WebAppPool -Name "${{ secrets.APPLICATION_POOL_TEST }}"
